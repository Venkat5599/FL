[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"

# The Flare periphery interfaces declare `>=0.7.6 <0.9`; the FCC scaffold contracts are
# written for 0.8.27. Pinning here keeps both compiling under one version rather than
# letting forge pick a floating solc per file.
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@flarenetwork/flare-periphery-contracts/=node_modules/@flarenetwork/flare-periphery-contracts/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
flare = "${FLARE_RPC_URL}"
songbird = "${SONGBIRD_RPC_URL}"

# Coston2 runs a Blockscout instance, so verification goes through its API rather than
# an Etherscan key. The `key` is ignored by Blockscout but forge requires the field.
[etherscan]
coston2 = { key = "${VERIFIER_API_KEY}", url = "https://coston2-explorer.flare.network/api", chain = 114 }
flare = { key = "${VERIFIER_API_KEY}", url = "https://flare-explorer.flare.network/api", chain = 14 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
